# Stopgap: bare/idle shells and `sh -c` wrappers are generic parents, so
# Layer 1 never attributes them to an app and Layer 4 used to show them as
# separate "bash"/"dash"/"fish" rows. Collect them in one row instead.
# Shell scripts (`bash ./foo.sh`) still resolve to the script name.
[[system_category]]
id = "sys.shells"
name = "Shells"
exe = ["bash", "dash", "sh", "zsh", "fish", "ksh", "tcsh", "csh"]
