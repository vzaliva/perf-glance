[package]
name = "perf-glance"
version = "0.2.0"
edition = "2021"
description = "A terminal-based, holistic system utilization monitor for Linux and macOS"
readme = "README.md"
license = "MIT"
authors = []

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.28"

# System info (cross-platform: Linux, macOS)
sysinfo = "0.30"

# Config & serialization
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
directories = "6.0"
dirs = "5.0"
nix = { version = "0.29", default-features = false, features = ["user", "signal"] }
regex = "1.10"
once_cell = "1.19"

# Linux process info (stat, sysconf)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# macOS-specific (for .app bundle parsing)
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.5"

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "perf-glance"
path = "src/main.rs"
